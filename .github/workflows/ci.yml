name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['7.2', '7.4', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: PHP lint
        run: find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l
      - name: Offline tests (no network, no secrets)
        run: php tests/run.php

  phpcs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer
          coverage: none
      - run: composer install --no-interaction --no-progress
      - name: WordPress Coding Standards + PHP 7.2 compatibility
        run: vendor/bin/phpcs

  zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sh bin/build-zip.sh
      - uses: actions/upload-artifact@v4
        with:
          name: satelit-moldova-data
          path: build/satelit-moldova-data.zip
